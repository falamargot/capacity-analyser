name: CI

# TS-1: this repo previously had no CI at all — tests, lint, typecheck, and
# build were never gated on push/PR, so regressions (including several this
# workflow's own audit found) could land silently. Blocking gates below are
# genuinely green today (0 lint errors/warnings, 987+ tests passing, build
# succeeds). Typecheck is gated as a *baseline ratchet* (see its step): the
# pre-existing error count may not grow, and shrinking it is encouraged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: Typecheck (baseline ratchet)
    runs-on: ubuntu-latest
    # The codebase carried a pre-existing TypeScript error baseline (199 →
    # 140 after the TS-1 audit's fixes — see
    # docs/Capacity_Analyzer_Production_Code_Audit.md TS-1). That baseline is
    # now fully burned down: `tsc -p tsconfig.app.json --noEmit` reports 0
    # errors as of 2026-08-28, so the ratchet is locked at zero and any new
    # error fails the job. The ratchet mechanism stays in place:
    #   - any NET INCREASE above the baseline fails the job,
    #   - a DECREASE passes and asks you to lower TYPECHECK_BASELINE to lock it in,
    #   - the delta is always printed for visibility.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck against error baseline
        env:
          # Lower this whenever the count drops (the step tells you the new value).
          TYPECHECK_BASELINE: 0
        run: |
          # tsc exits non-zero when diagnostics exist. Preserve that status so an
          # invocation/configuration crash cannot be mistaken for a drop to zero.
          set +e
          npx tsc -p tsconfig.app.json --noEmit > tsc.log 2>&1
          tsc_status=$?
          set -e
          count=$(grep -c "error TS" tsc.log || true)
          count=${count:-0}
          delta=$((count - TYPECHECK_BASELINE))
          echo "TypeScript errors: ${count} (baseline ${TYPECHECK_BASELINE}, delta ${delta})"
          if [ "$tsc_status" -ne 0 ] && [ "$count" -eq 0 ]; then
            echo "::error::TypeScript invocation failed without compiler diagnostics (exit ${tsc_status})."
            cat tsc.log
            exit "$tsc_status"
          fi
          if [ "$count" -gt "$TYPECHECK_BASELINE" ]; then
            echo "::error::TypeScript error count rose from ${TYPECHECK_BASELINE} to ${count} (+${delta}). A net increase is not allowed — fix it or it blocks merge."
            grep "error TS" tsc.log || true
            exit 1
          fi
          if [ "$count" -lt "$TYPECHECK_BASELINE" ]; then
            echo "::notice::TypeScript errors dropped from ${TYPECHECK_BASELINE} to ${count} (${delta}). Lower TYPECHECK_BASELINE in .github/workflows/ci.yml to ${count} to lock in the improvement."
          else
            echo "TypeScript error count matches the baseline."
          fi
